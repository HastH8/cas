<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CAS Metabolism Showcase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .grid img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .grid img:hover {
      transform: scale(1.03);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.9);
    }

    .modal-content {
      display: block;
      max-width: 90%;
      max-height: 90%;
      margin: 5% auto;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #bbb;
    }
  </style>
</head>
<body>

<h1>CAS Metabolism + HUD + Essentials Showcase</h1>

<div class="grid">
  <img src="imgs/Main HUD from Discord.png" alt="Screenshot 1" onclick="openModal(this)">
  <img src="imgs/DD Mode from Discord.png" alt="Screenshot 2" onclick="openModal(this)">
  <img src="imgs/Disabling Cas Metabolism from Discord.png" alt="Screenshot 3" onclick="openModal(this)">
  <img src="imgs/HUD Size from Discord.png" alt="Screenshot 4" onclick="openModal(this)">
  <img src="imgs/Settings Menu from Discord.png" alt="Screenshot 5" onclick="openModal(this)">
  <!-- Add more images as needed -->
</div>

<!-- Modal for image preview -->
<div id="imgModal" class="modal" onclick="closeModal()">
  <span class="close" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
  function openModal(img) {
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    modal.style.display = "block";
    modalImg.src = img.src;
  }

  function closeModal() {
    document.getElementById('imgModal').style.display = "none";
  }
</script>

</body>
</html>
